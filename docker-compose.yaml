services:
  panel:
    build: .
    container_name: cobbleverse-admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      - ./app:/app/app
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    networks:
      - rede-cobbleverse

networks:
  rede-cobbleverse:
    external: true