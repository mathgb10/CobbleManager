services:
  panel:
    build: .
    container_name: cobbleverse-admin
    restart: unless-stopped

    user: "0:0"

    ports:
      - "127.0.0.1:8082:8082"

    volumes:
      - ./app:/app/app
      - /var/run/docker.sock:/var/run/docker.sock
    
    group_add:
      - "999"

    env_file:
      - .env

    command: uvicorn app.main:app --host 0.0.0.0 --port 8082 --reload
    networks:
      - rede-cobbleverse
    init: true

    security_opt:
      - no-new-privileges:true

networks:
  rede-cobbleverse:
    external: true