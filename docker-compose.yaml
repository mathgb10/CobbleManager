
services:
  panel:
    build: .
    container_name: cobbleverse-admin
    restart: unless-stopped

    ports:
      - "127.0.0.1:8082:8082"

    volumes:
      - ./app:/app/app

    env_file:
      - .env

    command: uvicorn app.main:app --host 0.0.0.0 --port 8082 --reload

    init: true

    security_opt:
      - no-new-privileges:true
